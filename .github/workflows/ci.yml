name: CI

on:
  push:
    branches: [main, chore/finalize-repo]
  pull_request:
    branches: [main, chore/finalize-repo]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm test

      - name: Build component (frontend + wheel)
        run: python -m gradio cc build . --no-bump-version --no-generate-docs --python-path "$(python -c 'import sys; print(sys.executable)')"

      - name: Validate distribution metadata
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install --force-reinstall --no-deps dist/*.whl

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests/ -v
